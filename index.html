var QUESTIONS = [{"q": "他加班到十一点，发来一句「今天有点累」。你第一反应——", "a": [{"t": "陪他把今天的事一件件讲完", "r": "bubble"}, {"t": "给他点一份他常吃的，让他吃了再睡", "r": "toolbox"}, {"t": "回一句「那你自己安排」，不追问", "r": "limited"}, {"t": "回「累就早点睡」，然后继续做自己的事", "r": "water"}]}, {"q": "你们第一次一起过周末，你更想——", "a": [{"t": "把行程、餐厅、路线都排好", "r": "toolbox"}, {"t": "不排，当天想去哪去哪", "r": "limited"}, {"t": "都行，他定就好", "r": "water"}, {"t": "留半天什么都不安排，就在家待着", "r": "anchor"}]}, {"q": "他带你去他的朋友聚会，散场后你最希望听到——", "a": [{"t": "「你对象挺有性格」", "r": "limited"}, {"t": "「你对象办事特别利索」", "r": "toolbox"}, {"t": "「你对象挺靠谱的」", "r": "anchor"}, {"t": "「你对象说话真舒服」", "r": "bubble"}]}, {"q": "吵完架，最后通常是——", "a": [{"t": "冷战两天，然后自然和好", "r": "water"}, {"t": "我先找他，把话说开", "r": "anchor"}, {"t": "我把自己的想法讲清楚，他听着", "r": "bubble"}, {"t": "谁也别哄谁，吵到他真想明白", "r": "limited"}]}, {"q": "你被夸得最多的一句是——", "a": [{"t": "「跟你在一起特别安心」", "r": "anchor"}, {"t": "「你懂我在说什么」", "r": "bubble"}, {"t": "「你挺特别的」", "r": "limited"}, {"t": "「有事找你准没错」", "r": "toolbox"}]}, {"q": "见他爸妈那天，你——", "a": [{"t": "跟他爸妈聊开了，把冷场接住", "r": "bubble"}, {"t": "做自己，不刻意迎合", "r": "limited"}, {"t": "全程礼貌，不多话", "r": "water"}, {"t": "提前问清忌讳，不出错", "r": "anchor"}]}, {"q": "他半夜发一句「在吗」，你——", "a": [{"t": "第二天早上再回，不解释", "r": "limited"}, {"t": "先把他要的东西准备好再回", "r": "toolbox"}, {"t": "秒回，问他出什么事了", "r": "anchor"}, {"t": "回，然后陪他把事情讲完", "r": "bubble"}]}, {"q": "你最怕自己在他那儿变成——", "a": [{"t": "他挑不出毛病，也说不出喜欢什么", "r": "water"}, {"t": "他离不开我，但也不为我留下", "r": "anchor"}, {"t": "他跟我说的最多，最后选的是别人", "r": "bubble"}, {"t": "他记不住我，只记得我难搞", "r": "limited"}]}, {"q": "他临时说「我妈明天来」，你会——", "a": [{"t": "当天把家里收拾好，把流程过一遍", "r": "anchor"}, {"t": "告诉他我明天有安排，改不了", "r": "limited"}, {"t": "行吧，来就来", "r": "water"}, {"t": "先把他的紧张聊下去，再一起准备", "r": "bubble"}]}, {"q": "他手机里给你的备注，最可能是——", "a": [{"t": "一个外号", "r": "limited"}, {"t": "全名", "r": "water"}, {"t": "只有你俩懂的称呼", "r": "bubble"}, {"t": "名字后面加一句提醒", "r": "anchor"}]}, {"q": "他失业那阵，你做得最多的是——", "a": [{"t": "不劝他，照常过日子", "r": "limited"}, {"t": "陪着，不多嘴", "r": "water"}, {"t": "听他讲，帮他把情绪放下来", "r": "bubble"}, {"t": "帮他改简历、打听机会、跑腿", " ": "她让我踏实", "r": "anchor"}, {"t": "跟她有话说", "r": "bubble"}]}, {"q": "你更想被记住的是——", "a": [{"t": "我最难的时候她在", "r": "anchor"}, {"t": "她懂我", "r": "bubble"}, {"t": "她帮我扛过", "r": "toolbox"}, {"t": "她跟别人不一样", "r": "limited"}]}, {"q": "他半夜说「算了，没事」，你——", "a": [{"t": "追问，把那半句挖出来", "r": "bubble"}, {"t": "行，那就没事", "r": "limited"}, {"t": "那就睡吧", "r": "water"}, {"t": "不问，但第二天留心", "r": "anchor"}]}, {"q": "你的相册里最多的是——", "a": [{"t": "自己的照片", "r": "limited"}, {"t": "别人让我办的事的截图", "r": "toolbox"}, {"t": "两个人一起的", "r": "anchor"}, {"t": "聊天截图", "r": "bubble"}]}, {"q": "关系里你最容易累在——", "a": [{"t": "一直在兜底", "r": "anchor"}, {"t": "一直在听", "r": "bubble"}, {"t": "一直在办", "r": "toolbox"}, {"t": "一直在忍", "r": "limited"}]}, {"q": "他做错事，你更可能——", "a": [{"t": "算了，不提了", "r": "water"}, {"t": "先说清楚，再一起收拾", "r": "anchor"}, {"t": "先问他为什么这么做", "r": "bubble"}, {"t": "摆明了，让他知道后果", "r": "limited"}]}, {"q": "你心里那个「我值几分」，取决于——", "a": [{"t": "他有没有真的听懂我", "r": "bubble"}, {"t": "我有没有真的帮上他", "r": "toolbox"}, {"t": "他有没有把我当唯一", "r": "limited"}, {"t": "他有没有真的留下", "r": "anchor"}]}, {"q": "如果这个评价只能由他给，你最怕他说——", "a": [{"t": "你挺好的，但不是我要的", "r": "bubble"}, {"t": "有你在确实方便", "r": "toolbox"}, {"t": "你太难搞了", "r": "limited"}, {"t": "你值得更好的人", "r": "anchor"}]}];
var TITLE = "抛开颜值你的性格在男女关系中值多少分";
var KICKER = "你的性格值";
var idx = 0, answers = [];
var $ = function (id) { return document.getElementById(id); };
function escapeHtml(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function show(id) {
  var list = document.querySelectorAll("section");
  for (var i = 0; i < list.length; i++) list[i].classList.remove("on");
  $(id).classList.add("on");
  window.scrollTo(0, 0);
}
function render() {
  var q = QUESTIONS[idx];
  $("num").textContent = (idx + 1);
  $("prog").style.width = ((idx + 1) / QUESTIONS.length * 100) + "%";
  $("qtext").textContent = q.q;
  var box = $("opts");
  box.innerHTML = "";
  q.a.forEach(function (o) {
    var b = document.createElement("button");
    b.className = "opt";
    b.textContent = o.t;
    b.onclick = function () { pick(o.r); };
    box.appendChild(b);
  });
  $("back").style.display = idx === 0 ? "none" : "block";
}
function pick(r) {
  answers[idx] = r;
  if (idx < QUESTIONS.length - 1) { idx++; render(); }
  else { show("loading"); setTimeout(finish, 1000); }
}
function tally() {
  var c = {};
  answers.forEach(function (r) { c[r] = (c[r] || 0) + 1; });
  var best = -1, win = [];
  Object.keys(c).forEach(function (k) {
    if (c[k] > best) { best = c[k]; win = [k]; } else if (c[k] === best) { win.push(k); }
  });
  if (win.length === 1) return win[0];
  var tail = {}, tailBest = -1, tailWin = [];
  answers.slice(-3).forEach(function (r) { tail[r] = (tail[r] || 0) + 1; });
  win.forEach(function (k) {
    var n = tail[k] || 0;
    if (n > tailBest) { tailBest = n; tailWin = [k]; } else if (n === tailBest) { tailWin.push(k); }
  });
  if (tailWin.length === 1) return tailWin[0];
  return answers[answers.length - 1];
}
var CURRENT = null;
function finish() {
  var key = tally(), r = RESULTS[key];
  CURRENT = r;
  $("rk").innerHTML = r.sc
    ? escapeHtml(KICKER) + ' <span class="sc">' + escapeHtml(r.sc) + ' 分</span>'
    : escapeHtml(KICKER);
  $("rword").textContent = r.w;
  $("rsub").textContent = r.sub;
  $("rcard").textContent = r.card;
  if (r.concl) { $("rconcl").innerHTML = r.concl; }
  $("fig").innerHTML = FIGURES[r.f] || FIGURES.person;
  var box = $("rtags"); box.innerHTML = "";
  r.tags.forEach(function (t) {
    var s = document.createElement("span");
    s.className = "rtag"; s.textContent = "#" + t;
    box.appendChild(s);
  });
  show("result");
}
function toast(msg) {
  var t = $("toast");
  t.textContent = msg; t.classList.add("on");
  setTimeout(function () { t.classList.remove("on"); }, 1800);
}
$("start").onclick = function () { idx = 0; answers = []; render(); show("quiz"); };
$("back").onclick = function () { if (idx > 0) { idx--; render(); } };
$("again").onclick = function () { idx = 0; answers = []; show("intro"); };
$("share").onclick = function () {
  var w = $("rword").textContent;
  var sc = CURRENT ? CURRENT.sc : "";
  var text = sc
    ? KICKER + sc + " 分，是「" + w + "」。" + TITLE
    : KICKER + "「" + w + "」。" + TITLE;
  if (navigator.share) {
    navigator.share({ title: TITLE, text: text }).catch(function () { toast("截图保存这张卡片，直接发出去就行。"); });
  } else {
    toast("截图保存这张卡片，直接发出去就行。");
  }
};
