<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>你的审美对应哪一款包包</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#e6dfd0;--card:#fffdf7;--ink:#141414;--muted:#8b8171;--line:#ded5c4;--accent:#b23a28;--hi:#f5e07a}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:16px;line-height:1.7}
#app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:18px 20px 28px}
section{display:none;flex:1;flex-direction:column}
section.on{display:flex;animation:fade .3s ease both}
#result.on{justify-content:center}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.nav{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:.12em;padding:6px 0 20px}
.nav b{font-weight:400}
.nav .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;display:inline-block;vertical-align:1px}
h1{font-size:34px;line-height:1.42;font-weight:800;letter-spacing:-.02em;margin:10px 0 16px;text-align:center}
.lead{font-size:15px;color:#5f584c;line-height:1.9;text-align:center}
.meta{margin:0;font-size:12.5px;color:var(--muted);letter-spacing:.02em;text-align:center}
.demo{margin-top:26px;background:var(--card);border-radius:20px;padding:4px 16px;box-shadow:0 6px 22px rgba(80,60,30,.07)}
.dr{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f2ecdd}
.dr:last-child{border-bottom:0}
.av{flex:0 0 28px;height:28px;border-radius:50%;background:#efe7d6;color:#94897a;font-size:13px;display:flex;align-items:center;justify-content:center}
.nm{font-size:14px;color:#4a4438;letter-spacing:.01em}
.nm em{font-style:normal;color:#a99e89}
.cta{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:14px}
.btn{width:80%;max-width:300px;border:0;border-radius:100px;background:var(--accent);color:#fffdf7;font-size:17px;letter-spacing:.1em;padding:17px 0;font-family:inherit;font-weight:600}
.btn:active{opacity:.85}
.qhead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:9px}
.cnt{font-size:13px;letter-spacing:.06em;color:var(--muted)}
.cnt em{font-style:normal;font-size:23px;font-weight:800;color:var(--ink);margin-right:3px}
.hint{font-size:11px;color:#a2977f;padding-bottom:4px}
.bar{height:4px;border-radius:100px;background:#fff6e9;overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:100px;transition:width .28s ease}
.qtext{font-size:23px;font-weight:700;line-height:1.5;letter-spacing:-.01em;margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:100px;padding:13px 18px;font-size:16px;line-height:1.5;color:var(--ink);font-family:inherit}
.optn{flex:0 0 23px;height:23px;border-radius:100px;background:#ece1c9;color:#7a6c58;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:0;font-style:normal}
.optt{flex:1;text-align:left}
.opt:active{background:#141414;color:var(--card);border-color:#141414}
.opt:active .optn{background:rgba(255,253,247,.16);color:#fffdf7}
.back{margin-top:18px;font-size:13px;color:var(--muted);background:none;border:0;font-family:inherit;align-self:center}
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.loading p{font-size:14px;color:#5f584c;letter-spacing:.06em}
.lbar{width:180px;height:4px;background:#fff6e9;border-radius:100px;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:100px;animation:fill 1s ease forwards}
@keyframes fill{to{width:100%}}
.card{background:var(--card);border-radius:26px;padding:19px 20px 17px;box-shadow:0 8px 28px rgba(80,60,30,.08)}
.rk{font-size:12.5px;color:var(--muted);letter-spacing:.02em;text-align:center;line-height:1.9}
.rk .sc{display:inline-block;margin-left:6px;color:var(--accent);font-weight:800;font-size:22px;letter-spacing:.01em;vertical-align:-1px}
.rw{display:inline-block;font-size:52px;font-weight:800;line-height:1.3;letter-spacing:.04em;margin:2px 0;background:linear-gradient(transparent 60%,var(--hi) 60%);padding:0 4px}
.rtop{text-align:center}
.rs{font-size:15.5px;color:#5f584c;margin-bottom:9px;text-align:center}
.fig{display:flex;justify-content:center;margin:0 0 4px}
.fig svg{width:114px;height:114px}
.rtags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:9px;justify-content:center}
.rtag{font-size:13px;color:#7a6c58;background:#f3ecdd;border-radius:100px;padding:6px 13px}
.rcard{background:#ebe2d1;color:#2b2620;border-radius:18px;padding:14px 16px;font-size:16px;line-height:1.62;letter-spacing:.01em;border:1px solid #ded5c4}
.concl{margin-top:8px;padding-top:9px;border-top:1px solid var(--line);text-align:center}
.concl b{display:block;font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:400;margin-bottom:8px}
.concl p{font-size:13px;color:#6b6152;line-height:1.85}
.preport{margin-top:18px}
.preport h2{font-size:12px;letter-spacing:.22em;color:#7a6c58;font-weight:400;text-align:center;margin:2px 0 11px}
.preport .rb{background:var(--card);border-radius:20px;padding:15px 17px;margin-bottom:10px;box-shadow:0 5px 18px rgba(80,60,30,.06)}
.preport .rb>b{display:block;font-size:14.5px;letter-spacing:.01em;margin-bottom:6px;color:var(--ink)}
.preport .rb>b i{font-style:normal;color:var(--accent);font-size:11.5px;letter-spacing:.06em;margin-right:7px}
.preport .rb>p{font-size:14px;color:#5f584c;line-height:1.82}
#result.has-rep{justify-content:flex-start}
.share{margin-top:15px;width:100%;border:0;border-radius:100px;background:var(--accent);color:#fffdf7;font-size:16px;font-weight:600;letter-spacing:.08em;padding:15px 0;font-family:inherit}
.share:active{opacity:.85}
.again{display:block;margin:13px auto 0;background:none;border:0;font-size:13px;color:var(--muted);text-decoration:underline;font-family:inherit}
.foot{margin-top:10px;padding-top:10px;font-size:11px;color:#a99e89;line-height:1.8;text-align:center}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:rgba(20,20,20,.93);color:#fffdf7;font-size:13px;padding:11px 18px;border-radius:100px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
<section id="intro" class="on">
  <div class="nav"><span><i class="dot"></i>关系位置 · 审美与包</span><span></span></div>
  <h1>你的审美<br>对应哪一款包包</h1>
  <p class="lead">你选的东西，一直在替你先说话。<br>这个只问它在说什么。</p>
  <div class="cta">
    <button class="btn" id="start">开 始</button>
    <p class="meta">30 题 · 约 3 分钟 · 没有正确答案</p>
  </div>
</section>
<section id="quiz">
  <div class="nav"><span><i class="dot"></i>关系位置 · 审美与包</span><span>答题</span></div>
  <div class="qhead"><div class="cnt"><em id="num">1</em>/ 30</div><div class="hint">选最像你的那个</div></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="qtext" id="qtext"></div>
  <div class="opts" id="opts"></div>
  <button class="back" id="back">← 上一题</button>
</section>
<section id="loading">
  <div class="loading"><p>正在算你在哪一栏…</p><div class="lbar"><i></i></div></div>
</section>
<section id="result">
  <div class="nav"><span><i class="dot"></i>关系位置 · 审美与包</span><span>结果</span></div>
  <div class="card">
    <div class="rtop">
      <div class="rk" id="rk">你的审美，对应</div>
      <div class="rw" id="rword"></div>
      <div class="rs" id="rsub"></div>
    </div>
    <div class="fig" id="fig"></div>
    <div class="rtags" id="rtags"></div>
    <div class="rcard" id="rcard"></div>
    <div class="concl"><b>结 语</b><p id="rconcl">别人先看见包，后来记住的是你的眼光。<br>包会换，眼光不会。</p></div>
  </div>
  <div class="preport" id="rrep"></div>
  <button class="share" id="share">保存并分享</button>
  <button class="again" id="again">重新走一遍</button>
  <div class="foot">娱乐性质，与品牌无关。<br>不做心理诊断，不构成任何建议。</div>
</section>
</div>
<div class="toast" id="toast">截图保存这张卡片，直接发出去就行。</div>

verfull · 2007", "card": "它叫「永远装不满」，因为一天要装的东西，从来比想的多。轻、能折、随手就出门。你的审美不摆着看，是拿来过日子的那种好。", "tags": ["坦荡", "实用派", "不挑场合"], "f": "neverfull", "sc": "", "concl": "别人先看见包，后来记住的是你的眼光。<br>包会换，眼光不会。", "rep": ["你的审美落在「过日子」这一格。你不摆着看，你拿来用。东西到你手里是工具，不是展品。", "适合大、轻、能折的东西。你不介意不好看，你介意不好用。", "通勤、出差、带东西、临时加活，你全接得住。要端着拍照的场合，你会嫌麻烦。", "你太看实用，容易把「好看」当成浪费。久了，你的东西都很趁手，但很少让你心动。", "和你在一起很省心。你不挑场合、不挑天气，别人跟你出门不用做准备。", "一年留一件「没什么用，但你看着高兴」的东西。实用是本事，不是全部。"]}};

var QUESTIONS = [{"q": "你买包，第一个念头是——", "a": [{"t": "这包配不配我上班那一身", "r": "birkin"}, {"t": "拎出去会不会太显眼", "r": "jackie"}, {"t": "装不装得下我这堆东西", "r": "neverfull"}, {"t": "我平时真的需要带这么多吗", "r": "lady"}]}, {"q": "你最看不惯的是——", "a": [{"t": "包好看，但装不下任何东西", "r": "neverfull"}, {"t": "包很大，翻半天找不到钥匙", "r": "lady"}, {"t": "全身当季新款，没有一件旧东西", "r": "flap"}, {"t": "全身都对，但整个人没样子", "r": "jackie"}]}, {"q": "你的衣柜最像——", "a": [{"t": "都是能互相搭的几件", "r": "lady"}, {"t": "有几件放了很多年还在穿", "r": "flap"}, {"t": "分好场合，各归各位", "r": "birkin"}, {"t": "有几件是为了某个瞬间买的", "r": "jackie"}]}, {"q": "朋友问「这个包值不值」，你——", "a": [{"t": "先看它经不经得起三年", "r": "flap"}, {"t": "先问你在什么场合背", "r": "birkin"}, {"t": "先问你要装什么", "r": "neverfull"}, {"t": "先问你会不会一直用", "r": "lady"}]}, {"q": "你拍照最在意——", "a": [{"t": "整个人的姿态", "r": "jackie"}, {"t": "画面干不干净", "r": "birkin"}, {"t": "留白够不够", "r": "lady"}, {"t": "东西有没有都拍进去", "r": "neverfull"}]}, {"q": "你花在包上最大的一笔，给了——", "a": [{"t": "一个能撑住所有正式场合的", "r": "birkin"}, {"t": "一个有年头、现在还在出的老款", "r": "flap"}, {"t": "一个能天天背、装得下所有的", "r": "neverfull"}, {"t": "一个小到只装必要的", "r": "lady"}]}, {"q": "别人要借你的包，你——", "a": [{"t": "借，反正能装", "r": "neverfull"}, {"t": "犹豫，它太娇气，借出去怕刮", "r": "lady"}, {"t": "看场合，不一定", "r": "jackie"}, {"t": "不太想，热门色一直不好买", "r": "flap"}]}, {"q": "你逛店的方式是——", "a": [{"t": "看一圈，只试一个", "r": "lady"}, {"t": "先看价签，再看款", "r": "birkin"}, {"t": "先照镜子，看整体", "r": "jackie"}, {"t": "先摸料子，看做工", "r": "flap"}]}, {"q": "你最不能接受包上出现——", "a": [{"t": "一堆没用的装饰", "r": "neverfull"}, {"t": "超过三个夹层", "r": "lady"}, {"t": "大大的品牌字", "r": "flap"}, {"t": "不稳的颜色", "r": "birkin"}]}, {"q": "你换包的频率是——", "a": [{"t": "看心情，场合一变就换", "r": "jackie"}, {"t": "按场合配，两三个轮着", "r": "birkin"}, {"t": "一直用一个，用坏才换", "r": "neverfull"}, {"t": "很少换，越用越顺手", "r": "flap"}]}, {"q": "有人说「你审美真好」，你心里想的是——", "a": [{"t": "我只是删得多", "r": "lady"}, {"t": "我只是不追新的", "r": "flap"}, {"t": "我只是不出错", "r": "birkin"}, {"t": "我只是知道自己适合什么", "r": "jackie"}]}, {"q": "你的包里一定有——", "a": [{"t": "别人的伞、别人的药", "r": "neverfull"}, {"t": "口红和手机", "r": "lady"}, {"t": "名片和一支笔", "r": "birkin"}, {"t": "一块用了很久的手帕", "r": "flap"}]}, {"q": "你会因为什么买一个包——", "a": [{"t": "下周有个场合需要", "r": "birkin"}, {"t": "试背时镜子里的样子", "r": "jackie"}, {"t": "旧包实在装不下了", "r": "neverfull"}, {"t": "它小得刚好", "r": "lady"}]}, {"q": "你觉得最土的是——", "a": [{"t": "新东西硬装成老款", "r": "flap"}, {"t": "不分场合乱背", "r": "birkin"}, {"t": "包比人抢眼", "r": "neverfull"}, {"t": "背个大包，里面只装手机", "r": "lady"}]}, {"q": "挑包时你最久的一步是——", "a": [{"t": "在镜子前反复转身", "r": "jackie"}, {"t": "把东西全塞进去试", "r": "neverfull"}, {"t": "想清楚要扔掉什么", "r": "lady"}, {"t": "查它的年份和做工", "r": "flap"}]}, {"q": "你更信哪一种眼光——", "a": [{"t": "场合对的眼光", "r": "birkin"}, {"t": "时间验过的眼光", "r": "flap"}, {"t": "会删的眼光", "r": "lady"}, {"t": "一眼就对的眼光", "r": "jackie"}]}, {"q": "你送人礼物会选——", "a": [{"t": "实用的、能天天用的", "r": "neverfull"}, {"t": "小的、精致的", "r": "lady"}, {"t": "有年头、有来历的", "r": "flap"}, {"t": "得体、不会出错的", "r": "birkin"}]}, {"q": "你手机里存得最多的图是——", "a": [{"t": "街拍和姿态", "r": "jackie"}, {"t": "极简的空间", "r": "lady"}, {"t": "通勤穿搭", "r": "birkin"}, {"t": "老物件细节", "r": "flap"}]}, {"q": "你最受不了自己的是——", "a": [{"t": "包永远像个行李箱", "r": "neverfull"}, {"t": "什么场合都一个样", "r": "birkin"}, {"t": "舍不得扔旧东西", "r": "flap"}, {"t": "为了小牺牲了实用", "r": "lady"}]}, {"q": "有人说「你这包好像不便宜」，你——", "a": [{"t": "说这是老款，现在还在出", "r": "flap"}, {"t": "说不大，装不了什么", "r": "lady"}, {"t": "说场合需要", "r": "birkin"}, {"t": "笑笑，不解释", "r": "jackie"}]}, {"q": "你判断一个人审美好不好，先看——", "a": [{"t": "他会不会分场合", "r": "birkin"}, {"t": "他站着的样子", "r": "jackie"}, {"t": "他身上有没有多余的东西", "r": "lady"}, {"t": "他有没有一件用了很久的东西", "r": "flap"}]}, {"q": "销售说「这是爆款」，你——", "a": [{"t": "先背上看看", "r": "jackie"}, {"t": "先问有没有别的颜色", "r": "birkin"}, {"t": "先问能不能装 A4", "r": "neverfull"}, {"t": "先问是不是当季", "r": "flap"}]}, {"q": "你理想中的包是——", "a": [{"t": "小到不需要整理", "r": "lady"}, {"t": "大到不用挑东西", "r": "neverfull"}, {"t": "好看到让人回头", "r": "jackie"}, {"t": "旧到不用赶潮流", "r": "flap"}]}, {"q": "出门前你最后做的一件事——", "a": [{"t": "照一眼镜子", "r": "jackie"}, {"t": "确认场合对不对", "r": "birkin"}, {"t": "确认东西带齐了", "r": "neverfull"}, {"t": "把多余的东西拿出来", "r": "lady"}]}, {"q": "你更怕哪种评价——", "a": [{"t": "你太实在了", "r": "neverfull"}, {"t": "你太端着", "r": "jackie"}, {"t": "你太讲究了", "r": "lady"}, {"t": "你太旧了", "r": "flap"}]}, {"q": "你给自己买过最不实用的一样东西是——", "a": [{"t": "一个只能装手机的包", "r": "jackie"}, {"t": "一个不好搭的旧包", "r": "flap"}, {"t": "一个没有夹层的小包", "r": "lady"}, {"t": "一个只能配一套衣服的包", "r": "birkin"}]}, {"q": "你的包放在家里什么地方——", "a": [{"t": "挂门口，随时拿", "r": "neverfull"}, {"t": "按场次排好", "r": "birkin"}, {"t": "收在盒子里", "r": "flap"}, {"t": "放桌上，当摆设", "r": "lady"}]}, {"q": "你更愿意花时间在——", "a": [{"t": "找那个「一背上就对」的", "r": "jackie"}, {"t": "找那个「什么场合都行」的", "r": "birkin"}, {"t": "找那个「什么都装得下」的", "r": "neverfull"}, {"t": "找那个「十年后还好看」的", "r": "flap"}]}, {"q": "你和朋友的审美分歧，通常在于——", "a": [{"t": "她觉得你太素", "r": "lady"}, {"t": "你觉得她太麻烦", "r": "neverfull"}, {"t": "她觉得你太旧", "r": "flap"}, {"t": "她觉得你太保守", "r": "birkin"}]}, {"q": "如果只能留一个包，你留——", "a": [{"t": "能应付所有场合的那个", "r": "birkin"}, {"t": "能装下所有的那个", "r": "neverfull"}, {"t": "最轻的那个", "r": "lady"}, {"t": "最有故事的那个", "r": "flap"}]}];
var TITLE = "你的审美对应哪一款包包";
var KICKER = "你的审美，对应";
var idx = 0, answers = [];
var $ = function (id) { return document.getElementById(id); };
function escapeHtml(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function show(id) {
  var list = document.querySelectorAll("section");
  for (var i = 0; i < list.length; i++) list[i].classList.remove("on");
  $(id).classList.add("on");
  window.scrollTo(0, 0);
}
function render() {
  var q = QUESTIONS[idx];
  $("num").textContent = (idx + 1);
  $("prog").style.width = ((idx + 1) / QUESTIONS.length * 100) + "%";
  $("qtext").textContent = q.q;
  var box = $("opts");
  box.innerHTML = "";
  q.a.forEach(function (o, i) {
    var b = document.createElement("button");
    b.className = "opt";
    var n = document.createElement("span");
    n.className = "optn";
    n.textContent = String(i + 1);
    var t = document.createElement("span");
    t.className = "optt";
    t.textContent = o.t;
    b.appendChild(n);
    b.appendChild(t);
    b.onclick = function () { pick(o.r); };
    box.appendChild(b);
  });
  $("back").style.display = idx === 0 ? "none" : "block";
}
function pick(r) {
  answers[idx] = r;
  if (idx < QUESTIONS.length - 1) { idx++; render(); }
  else { show("loading"); setTimeout(finish, 1000); }
}
function tally() {
  var c = {};
  answers.forEach(function (r) { c[r] = (c[r] || 0) + 1; });
  var best = -1, win = [];
  Object.keys(c).forEach(function (k) {
    if (c[k] > best) { best = c[k]; win = [k]; } else if (c[k] === best) { win.push(k); }
  });
  if (win.length === 1) return win[0];
  var tail = {}, tailBest = -1, tailWin = [];
  answers.slice(-3).forEach(function (r) { tail[r] = (tail[r] || 0) + 1; });
  win.forEach(function (k) {
    var n = tail[k] || 0;
    if (n > tailBest) { tailBest = n; tailWin = [k]; } else if (n === tailBest) { tailWin.push(k); }
  });
  if (tailWin.length === 1) return tailWin[0];
  return answers[answers.length - 1];
}
var REPTITLES = ["审美坐标总览", "风格适配分析", "场合适配度评估", "审美盲区诊断", "气质舒适指数", "审美优化建议"];
var CURRENT = null;
function finish() {
  var key = tally(), r = RESULTS[key];
  CURRENT = r;
  $("rk").innerHTML = r.sc
    ? escapeHtml(KICKER) + ' <span class="sc">' + escapeHtml(r.sc) + ' 分</span>'
    : escapeHtml(KICKER);
  $("rword").textContent = r.w;
  $("rsub").textContent = r.sub;
  $("rcard").textContent = r.card;
  if (r.concl) { $("rconcl").innerHTML = r.concl; }
  var rb = $("rrep");
  rb.innerHTML = "";
  if (r.rep && r.rep.length) {
    $("result").classList.add("has-rep");
    var h = document.createElement("h2");
    h.textContent = "诊断报告";
    rb.appendChild(h);
    r.rep.forEach(function (t, i) {
      var box = document.createElement("div");
      box.className = "rb";
      var head = document.createElement("b");
      head.innerHTML = '<i>0' + (i + 1) + '</i>' + REPTITLES[i];
      var body = document.createElement("p");
      body.textContent = t;
      box.appendChild(head);
      box.appendChild(body);
      rb.appendChild(box);
    });
  }
  $("fig").innerHTML = FIGURES[r.f] || FIGURES.person;
  var box = $("rtags"); box.innerHTML = "";
  r.tags.forEach(function (t) {
    var s = document.createElement("span");
    s.className = "rtag"; s.textContent = "#" + t;
    box.appendChild(s);
  });
  show("result");
}
function toast(msg) {
  var t = $("toast");
  t.textContent = msg; t.classList.add("on");
  setTimeout(function () { t.classList.remove("on"); }, 1800);
}
$("start").onclick = function () { idx = 0; answers = []; render(); show("quiz"); };
$("back").onclick = function () { if (idx > 0) { idx--; render(); } };
$("again").onclick = function () { idx = 0; answers = []; show("intro"); };
$("share").onclick = function () {
  var w = $("rword").textContent;
  var sc = CURRENT ? CURRENT.sc : "";
  var text = sc
    ? KICKER + sc + " 分，是「" + w + "」。" + TITLE
    : KICKER + "「" + w + "」。" + TITLE;
  if (navigator.share) {
    navigator.share({ title: TITLE, text: text }).catch(function () { toast("截图保存这张卡片，直接发出去就行。"); });
  } else {
    toast("截图保存这张卡片，直接发出去就行。");
  }
};
